<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;1,6..72,300&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:#e8e5dd;padding:24px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
  #og{width:1200px;height:630px;background:#fbf9f3;padding:76px 70px 64px;display:flex;flex-direction:column;justify-content:space-between;text-wrap:pretty}
  .row{display:flex;align-items:baseline;justify-content:space-between;gap:24px}
  .mono{font:400 17px 'IBM Plex Mono',monospace;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
  h1{margin:0;font:300 86px/1.02 Newsreader,Georgia,serif;letter-spacing:-.028em;color:#16150f;max-width:23ch}
  h1 em{font-style:italic;color:#1a6b5a}
  .proof{display:flex;gap:56px;border-top:1px solid #e2ddce;padding-top:26px}
  .proof span{font:400 19px 'IBM Plex Mono',monospace;letter-spacing:.04em;color:#6d6a5c;white-space:nowrap}
</style>
</head>
<body>
  <div id="og">
    <div class="row">
      <span class="mono" style="color:#1a6b5a">Samie Vargas · Austin, remote</span>
      <span class="mono" style="color:#9a9686">samievargas.com</span>
    </div>
    <h1>I ship AI tools that replace work I used to do <em>by hand</em>.</h1>
    <div class="proof">
      <span>Signal · 60 min → 1</span>
      <span>3.4M orders in dbt</span>
      <span>21,160 inspections</span>
    </div>
  </div>
</body>
</html>
