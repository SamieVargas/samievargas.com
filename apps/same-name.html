<body>

<script type="module">
import { stagedLoader } from '../js/staged-loader.js?v=20260831';

const PRESETS = ["Peter Jackson", "John Williams", "Mary Shelley", "David Jones", "Grace Lee", "Michael Jordan"];
const SPARQL_URL = "https://query.wikidata.org/sparql";

async function sparql(query, timeoutMs = 25000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const res = await fetch(SPARQL_URL + "?format=json&query=" + encodeURIComponent(query), {
      headers: { Accept: "application/sparql-results+json" },
      signal: ctrl.signal
    });
    if (res.status === 429) throw new Error("RATE_LIMIT");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const json = await res.json();
    return json.results.bindings || [];
  } catch (e) {
    if (e.name === "AbortError") throw new Error("TIMEOUT");
    throw e;
  } finally {
    clearTimeout(timer);
  }
}

function v(row, key) { return row && row[key] ? row[key].value : ""; }
function year(iso) {
  if (!iso) return "";
  const m = String(iso).match(/^(-?\d{1,4})/);
  return m ? String(parseInt(m[1], 10)) : "";
}

function centuryOf(y) {
  const c = Math.floor((y - 1) / 100) + 1;
  return c;
}
function ordinal(n) {
  const s = ["th", "st", "nd", "rd"], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

function esc(x) {
  return String(x).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

const state = {
  rows: [], loading: true, failed: false,
  note: "Querying Wikidata\u2026", ran: "", selected: 0, showLinks: false, showQuery: false, query: "",
  versus: false, rowsB: [], ranB: "", busyB: false
};

const nameInput = document.getElementById("name-input");
const nameBInput = document.getElementById("nameB-input");
const runBtn = document.getElementById("run-btn");
const versusBtn = document.getElementById("versus-btn");
const presetsEl = document.getElementById("presets");
const statusEl = document.getElementById("status");
const resultsEl = document.getElementById("results");
const stagesEl = document.getElementById("a3-stages");

function buildQuery(name) {
  const escd = name.replace(/["\\]/g, "");
  return 'SELECT ?p ?pLabel ?pDescription ?birth ?death ?placeLabel\n' +
    '       (GROUP_CONCAT(DISTINCT ?occLabel; separator=", ") AS ?occs)\n' +
    'WHERE {\n' +
    '  ?p rdfs:label "' + escd + '"@en ; wdt:P31 wd:Q5 .\n' +
    '  OPTIONAL { ?p wdt:P569 ?birth }\n' +
    '  OPTIONAL { ?p wdt:P570 ?death }\n' +
    '  OPTIONAL { ?p wdt:P19 ?place }\n' +
    '  OPTIONAL { ?p wdt:P106 ?occ .\n' +
    '             ?occ rdfs:label ?occLabel FILTER(LANG(?occLabel)="en") }\n' +
    '  SERVICE wikibase:label { bd:serviceParam wikibase:language "en". }\n' +
    '}\n' +
    'GROUP BY ?p ?pLabel ?pDescription ?birth ?death ?placeLabel\n' +
    'ORDER BY DESC(BOUND(?birth)) ?birth LIMIT 80';
}

function derive() {
  const people = state.rows.map((r, i) => {
    const b = year(v(r, "birth"));
    const d = year(v(r, "death"));
    const occ = v(r, "occs");
    return {
      i: i,
      name: v(r, "pLabel"),
      desc: (function (d) {
        if (!d) return "No description on file, which is its own kind of life.";
        const stripped = d.replace(/^\(?-?\d{3,4}\s*[\u2013-]\s*-?\d{0,4}\)?\s*/, "").trim();
        return stripped || "Recorded only by dates.";
      })(v(r, "pDescription")),
      occ: occ || "trade not recorded",
      occFirst: occ ? occ.split(",")[0].trim() : "",
      place: v(r, "placeLabel") || "not recorded",
      years: b ? b + (d ? "\u2013" + d : "\u2013") : "no dates on file",
      birthNum: b ? parseInt(b, 10) : null,
      uri: v(r, "p")
    };
  });

  const occCounts = {};
  people.forEach(p => { if (p.occFirst) occCounts[p.occFirst] = (occCounts[p.occFirst] || 0) + 1; });
  const occKeys = Object.keys(occCounts).sort((a, b) => occCounts[b] - occCounts[a]);
  const topOcc = occKeys[0];
  const shared = occKeys.filter(k => occCounts[k] > 1);

  const dated = people.filter(p => p.birthNum !== null);
  const years = dated.map(p => p.birthNum);
  const undated = people.length - dated.length;

  let closing = "";
  if (people.length) {
    const n = state.ran;
    if (topOcc && occCounts[topOcc] > 2) closing = "There have been " + occCounts[topOcc] + " " + topOcc + "s called " + n + ". At three, it stops being coincidence.";
    else if (years.length >= 2) closing = years.length + " dated lives across " + (Math.max.apply(null, years) - Math.min.apply(null, years)) + " years, and no two of them did the same thing twice.";
    else closing = "One life on record under that name.";
  }

  return { people, occCounts, occKeys, topOcc, shared, dated, years, undated, closing };
}

// Reduce a result set to the few numbers worth comparing between two names.
function digest(rows) {
  if (!rows.length) return null;
  const people = rows.map(r => ({
    birth: parseInt(year(v(r, "birth")), 10) || null,
    occ: (v(r, "occs") || "").split(",")[0].trim()
  }));
  const years = people.map(p => p.birth).filter(x => x);
  const counts = {};
  people.forEach(p => { if (p.occ) counts[p.occ] = (counts[p.occ] || 0) + 1; });
  const keys = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  return {
    total: people.length,
    earliest: years.length ? Math.min.apply(null, years) : null,
    median: years.length ? years.slice().sort((a, b) => a - b)[Math.floor(years.length / 2)] : null,
    trades: keys.length,
    topTrade: keys[0] || "\u2014"
  };
}

function renderStatus() {
  if (state.loading) {
    const widths = ["58%", "74%", "42%", "66%", "50%", "70%"];
    statusEl.innerHTML =
      '<div style="max-width: 1240px; margin: 0 auto; padding: 44px">' +
        '<div style="font-size: 10.5px; letter-spacing: 3px; color: #8a8071">' + esc(state.note) + '</div>' +
        '<div style="display: flex; flex-direction: column; gap: 14px; margin-top: 26px">' +
          widths.map(w =>
            '<div style="display: flex; gap: 18px; align-items: center; animation: shimmer 1.5s ease-in-out infinite">' +
              '<div style="width: 62px; height: 13px; background: #2e2a24"></div>' +
              '<div style="width: ' + w + '; height: 22px; background: #221f1a"></div>' +
            '</div>').join('') +
        '</div>' +
      '</div>';
  } else if (state.failed) {
    statusEl.innerHTML =
      '<div style="max-width: 1240px; margin: 0 auto; padding: 44px">' +
        '<div style="border-left: 2px solid #b2543f; padding-left: 18px">' +
          '<div style="font-size: 10.5px; letter-spacing: 2px; color: #b2543f">NOTHING RETURNED</div>' +
          '<p style="font-family: \'Instrument Serif\', serif; font-size: 24px; line-height: 1.4; margin: 10px 0 0; max-width: 620px">' + esc(state.note) + '</p>' +
        '</div>' +
      '</div>';
  } else {
    statusEl.innerHTML = "";
  }
}

function versusBoxHTML() {
  if (!(state.versus && state.rowsB.length > 0 && !state.loading)) return "";
  const A = digest(state.rows), B = digest(state.rowsB);
  const stats = (!A || !B) ? [] : [
    { label: "LIVES", a: A.total, b: B.total, delay: "0ms" },
    { label: "EARLIEST BORN", a: A.earliest || "\u2014", b: B.earliest || "\u2014", delay: "70ms" },
    { label: "MEDIAN BIRTH", a: A.median || "\u2014", b: B.median || "\u2014", delay: "140ms" },
    { label: "TRADES", a: A.trades, b: B.trades, delay: "210ms" }
  ];
  let finding = "";
  if (A && B) {
    if (A.topTrade === B.topTrade) finding = "Both names run to " + A.topTrade + "s. Either the trade is enormous or the name means nothing \u2014 usually the former.";
    else if (A.total > B.total * 1.5) finding = state.ran + " carries " + A.total + " lives against " + B.total + ", and skews to " + A.topTrade + "s where " + state.ranB + " skews to " + B.topTrade + "s.";
    else finding = state.ran + " skews to " + A.topTrade + "s, " + state.ranB + " to " + B.topTrade + "s. Same era, different work.";
  }
  const title = (state.ran || "").toUpperCase() + " \u25a0 vs \u25a0 " + (state.ranB || "").toUpperCase();
  const meta = state.busyB ? "querying\u2026" : "both queried live";
  return '<div style="margin-top: 30px; border: 1px solid #4a4238; padding: 24px 26px; animation: rise 320ms ease both">' +
    '<div style="display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: baseline">' +
      '<div style="font-size: 10px; letter-spacing: 2px; color: #8a8071; white-space: nowrap">' + esc(title) + '</div>' +
      '<div style="font-size: 10.5px; color: #6d6558; white-space: nowrap">' + esc(meta) + '</div>' +
    '</div>' +
    '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px; margin-top: 18px">' +
      stats.map(vs =>
        '<div style="animation: rowIn 340ms ease both; animation-delay: ' + vs.delay + '">' +
          '<div style="font-size: 9.5px; letter-spacing: 2px; color: #6d6558; white-space: nowrap">' + esc(vs.label) + '</div>' +
          '<div style="display: flex; gap: 12px; align-items: baseline; margin-top: 6px">' +
            '<span style="font-family: \'Instrument Serif\', serif; font-size: 26px; color: #c9a227">' + esc(vs.a) + '</span>' +
            '<span style="font-size: 11px; color: #6d6558">vs</span>' +
            '<span style="font-family: \'Instrument Serif\', serif; font-size: 26px; color: #b9ae9b">' + esc(vs.b) + '</span>' +
          '</div>' +
        '</div>').join('') +
    '</div>' +
    '<p style="font-family: \'Instrument Serif\', serif; font-style: italic; font-size: 20px; line-height: 1.4; margin: 20px 0 0">' + esc(finding) + '</p>' +
  '</div>';
}

function renderVersusSlot() {
  const slot = document.getElementById("versus-slot");
  if (slot) slot.innerHTML = versusBoxHTML();
}

function tileHTML(p, delay, undatedTile, occCounts) {
  const isSel = p.i === state.selected;
  const bg = isSel ? "#c9a227" : "transparent";
  const border = isSel ? "#c9a227" : (undatedTile ? "#282420" : "#332e27");
  const fg = isSel ? "#12100e" : (undatedTile ? "#8a8071" : "#f2e9d8");
  const sharedTile = !undatedTile && p.occFirst && occCounts[p.occFirst] > 1;
  const metaFg = isSel ? "#3d3116" : (undatedTile ? "#6d6558" : (sharedTile ? "#c9a227" : "#8a8071"));
  const yearTxt = undatedTile ? "\u2014" : p.birthNum;
  const occShort = undatedTile
    ? (p.occFirst ? p.occFirst.slice(0, 17) : "unrecorded")
    : (p.occFirst ? (p.occFirst.length > 18 ? p.occFirst.slice(0, 17) + "\u2026" : p.occFirst) : "unrecorded");
  return '<button type="button" class="tile" data-select="' + p.i + '" data-undated="' + (undatedTile ? "1" : "0") + '" data-shared="' + (sharedTile ? "1" : "0") + '" style="text-align: left; background: ' + bg + '; border: 1px solid ' + border + '; color: ' + fg + '; padding: 10px 13px; cursor: pointer; min-width: 132px; animation: tileIn 380ms ease both; animation-delay: ' + delay + '">' +
    '<div style="font-size: 15px; font-family: \'Instrument Serif\', serif; line-height: 1.1">' + esc(yearTxt) + '</div>' +
    '<div class="tile-meta" style="font-size: 10.5px; letter-spacing: 0.4px; margin-top: 5px; color: ' + metaFg + '">' + esc(occShort) + '</div>' +
  '</button>';
}

function linksHTML(d) {
  const linkNote = d.shared.length ? d.shared.length + " TRADES HELD BY MORE THAN ONE PERSON OF THIS NAME" : "NO TRADE IS HELD TWICE";
  const clusters = d.shared.slice(0, 6).map(k => {
    const list = d.people.filter(p => p.occFirst === k).sort((a, b) => (a.birthNum || 9999) - (b.birthNum || 9999));
    return {
      label: k, n: d.occCounts[k],
      chain: list.map((p, idx) => ({ year: p.birthNum || "undated", line: idx === list.length - 1 ? "transparent" : "#4a4238" }))
    };
  });
  return '<div style="margin-top: 34px; border-top: 1px solid #2e2a24; padding-top: 26px; animation: rise 260ms ease both">' +
    '<div style="font-size: 10px; letter-spacing: 3px; color: #8a8071">' + esc(linkNote) + '</div>' +
    '<div style="display: flex; flex-direction: column; gap: 20px; margin-top: 22px">' +
      clusters.map(cl =>
        '<div>' +
          '<div style="display: flex; align-items: baseline; gap: 12px">' +
            '<span style="font-family: \'Instrument Serif\', serif; font-size: 22px; color: #c9a227">' + esc(cl.label) + '</span>' +
            '<span style="font-size: 10.5px; color: #6d6558">' + esc(cl.n) + ' LIVES</span>' +
          '</div>' +
          '<div style="display: flex; align-items: center; gap: 0; margin-top: 12px; flex-wrap: wrap">' +
            cl.chain.map(node =>
              '<div style="display: flex; align-items: center">' +
                '<div style="border: 1px solid #4a4238; padding: 7px 12px; font-size: 11.5px; white-space: nowrap">' + esc(node.year) + '</div>' +
                '<div style="width: 26px; height: 1px; background: ' + node.line + '"></div>' +
              '</div>').join('') +
          '</div>' +
        '</div>').join('') +
    '</div>' +
  '</div>';
}

function selCardHTML(d) {
  const sel = d.people[state.selected] || d.people[0];
  if (!sel) return "";
  const selShares = sel.occFirst && d.occCounts[sel.occFirst] > 1
    ? (d.occCounts[sel.occFirst] - 1) + " other " + sel.occFirst + (d.occCounts[sel.occFirst] - 1 === 1 ? "" : "s") + " of this name"
    : "nobody else here";
  return '<div style="border: 1px solid #4a4238; background: #191612; padding: 26px; animation: rise 240ms ease both">' +
    '<div style="font-size: 9.5px; letter-spacing: 2px; color: #6d6558">' + esc(sel.years) + '</div>' +
    '<div style="font-family: \'Instrument Serif\', serif; font-size: 30px; line-height: 1.12; margin-top: 8px">' + esc(sel.name) + '</div>' +
    '<p style="font-size: 12.5px; line-height: 1.7; color: #b9ae9b; margin: 12px 0 0">' + esc(sel.desc) + '</p>' +
    '<div style="border-top: 1px solid #2e2a24; margin-top: 20px; padding-top: 16px; display: flex; flex-direction: column; gap: 12px; font-size: 12px; line-height: 1.6">' +
      '<div><span style="color: #6d6558">TRADE</span><br>' + esc(sel.occ) + '</div>' +
      '<div><span style="color: #6d6558">BORN IN</span><br>' + esc(sel.place) + '</div>' +
      '<div><span style="color: #6d6558">SHARES A TRADE WITH</span><br>' + esc(selShares) + '</div>' +
    '</div>' +
    '<a href="' + esc(sel.uri || "#") + '" target="_blank" rel="noopener" style="display: inline-block; margin-top: 20px; font-size: 11px; letter-spacing: 1.4px; border-bottom: 1px solid #c9a227">OPEN IN WIKIDATA \u2197</a>' +
  '</div>';
}

function queryPreHTML() {
  return '<pre style="font-size: 10.5px; line-height: 1.65; color: #b9ae9b; margin: 14px 0 0; white-space: pre-wrap; word-break: break-word">' + esc(state.query) + '</pre>';
}

function renderResults() {
  const d = derive();
  if (state.loading || state.failed || !d.people.length) { resultsEl.innerHTML = ""; return; }

  const total = d.people.length;
  const minYear = d.years.length ? Math.min.apply(null, d.years) : "\u2014";
  const maxYear = d.years.length ? Math.max.apply(null, d.years) : "\u2014";
  const occCount = d.occKeys.length;
  const commonOcc = d.topOcc ? d.topOcc + " \u00d7" + d.occCounts[d.topOcc] : "nothing repeats";
  const undatedNote = d.undated ? d.undated + " lives carry no birth date in Wikidata" : "every life here is dated";

  // Group into centuries; undated lives get their own bucket at the end.
  const buckets = {};
  let gTile = 0;
  d.dated.forEach(p => { const c = centuryOf(p.birthNum); (buckets[c] = buckets[c] || []).push(p); });
  const centuryBlocks = Object.keys(buckets).map(Number).sort((a, b) => a - b).map(c => {
    const list = buckets[c].sort((a, b) => a.birthNum - b.birthNum);
    return {
      label: ordinal(c),
      count: list.length + (list.length === 1 ? " life" : " lives"),
      tiles: list.map(p => tileHTML(p, Math.min(gTile++ * 30, 1600) + "ms", false, d.occCounts)).join('')
    };
  });
  if (d.undated > 0) {
    const list = d.people.filter(p => p.birthNum === null);
    centuryBlocks.push({
      label: "undated",
      count: d.undated + (d.undated === 1 ? " life" : " lives"),
      tiles: list.map(p => tileHTML(p, Math.min(gTile++ * 30, 1600) + "ms", true, d.occCounts)).join('')
    });
  }

  resultsEl.innerHTML =
    '<div style="max-width: 1240px; margin: 0 auto; padding: 0 44px; animation: rise 320ms ease both">' +

      '<div style="display: flex; gap: 46px; flex-wrap: wrap; border-bottom: 1px solid #2e2a24; padding: 30px 0 26px">' +
        '<div style="animation: rise 420ms ease both"><div style="font-size: 9.5px; letter-spacing: 2px; color: #6d6558">LIVES</div><div style="font-family: \'Instrument Serif\', serif; font-size: 40px; line-height: 1; margin-top: 6px">' + esc(total) + '</div></div>' +
        '<div style="animation: rise 420ms ease both; animation-delay: 70ms"><div style="font-size: 9.5px; letter-spacing: 2px; color: #6d6558">EARLIEST</div><div style="font-family: \'Instrument Serif\', serif; font-size: 40px; line-height: 1; margin-top: 6px">' + esc(minYear) + '</div></div>' +
        '<div style="animation: rise 420ms ease both; animation-delay: 140ms"><div style="font-size: 9.5px; letter-spacing: 2px; color: #6d6558">LATEST</div><div style="font-family: \'Instrument Serif\', serif; font-size: 40px; line-height: 1; margin-top: 6px">' + esc(maxYear) + '</div></div>' +
        '<div style="animation: rise 420ms ease both; animation-delay: 210ms"><div style="font-size: 9.5px; letter-spacing: 2px; color: #6d6558">TRADES</div><div style="font-family: \'Instrument Serif\', serif; font-size: 40px; line-height: 1; margin-top: 6px">' + esc(occCount) + '</div></div>' +
        '<div style="flex: 1; min-width: 220px; align-self: flex-end">' +
          '<div style="font-size: 9.5px; letter-spacing: 2px; color: #6d6558">THE RECURRING LIFE</div>' +
          '<div style="font-size: 15px; margin-top: 8px; color: #c9a227">' + esc(commonOcc) + '</div>' +
        '</div>' +
      '</div>' +

      '<div id="versus-slot">' + versusBoxHTML() + '</div>' +

      '<div style="display: grid; grid-template-columns: 1fr 330px; gap: 44px; margin-top: 34px; align-items: start">' +
        '<div>' +
          '<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap">' +
            '<div style="font-size: 10px; letter-spacing: 3px; color: #8a8071">BY CENTURY · CLICK A LIFE</div>' +
            '<button type="button" id="links-btn" class="links-btn">' + (state.showLinks ? "HIDE SHARED TRADES" : "SHOW SHARED TRADES") + '</button>' +
          '</div>' +

          '<div style="display: flex; flex-direction: column; gap: 2px; margin-top: 22px">' +
            centuryBlocks.map(c =>
              '<div style="border-top: 1px solid #2e2a24; padding: 20px 0 24px; display: grid; grid-template-columns: 96px 1fr; gap: 22px">' +
                '<div>' +
                  '<div style="font-family: \'Instrument Serif\', serif; font-size: 26px; line-height: 1">' + esc(c.label) + '</div>' +
                  '<div style="font-size: 10.5px; color: #6d6558; margin-top: 4px">' + esc(c.count) + '</div>' +
                '</div>' +
                '<div style="display: flex; flex-wrap: wrap; gap: 8px">' + c.tiles + '</div>' +
              '</div>').join('') +
          '</div>' +

          '<div id="links-slot">' + (state.showLinks ? linksHTML(d) : "") + '</div>' +
        '</div>' +

        '<div style="position: sticky; top: 24px">' +
          '<div id="sel-slot">' + selCardHTML(d) + '</div>' +

          '<div style="border: 1px solid #2e2a24; padding: 22px 24px; margin-top: 18px">' +
            '<div style="font-size: 9.5px; letter-spacing: 2px; color: #6d6558">THE FINDING</div>' +
            '<p style="font-family: \'Instrument Serif\', serif; font-style: italic; font-size: 20px; line-height: 1.4; margin: 10px 0 0">' + esc(d.closing) + '</p>' +
          '</div>' +

          '<div style="border: 1px solid #2e2a24; padding: 22px 24px; margin-top: 18px">' +
            '<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">' +
              '<div style="font-size: 9.5px; letter-spacing: 2px; color: #6d6558">THE QUERY</div>' +
              '<button type="button" id="query-btn" style="background: transparent; border: none; color: #c9a227; padding: 0; font-size: 10.5px; letter-spacing: 1.2px; cursor: pointer; border-bottom: 1px solid #c9a227">' + (state.showQuery ? "HIDE" : "SHOW SPARQL") + '</button>' +
            '</div>' +
            '<div id="query-slot">' + (state.showQuery ? queryPreHTML() : "") + '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +

      '<div style="margin-top: 60px; border-top: 1px solid #2e2a24; padding-top: 18px; font-size: 10px; letter-spacing: 2px; color: #6d6558; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px">' +
        '<span><a class="foot-link" href="/">SAMIEVARGAS.COM</a> · <a class="foot-link" href="./">MINI APPS</a></span><span>' + esc(undatedNote) + '</span>' +
      '</div>' +
    '</div>';
}

function selectPerson(i) {
  state.selected = i;
  const d = derive();
  resultsEl.querySelectorAll('[data-select]').forEach(el => {
    const idx = parseInt(el.dataset.select, 10);
    const isSel = idx === i;
    const und = el.dataset.undated === "1";
    const sh = el.dataset.shared === "1";
    el.style.background = isSel ? "#c9a227" : "transparent";
    el.style.borderColor = isSel ? "#c9a227" : (und ? "#282420" : "#332e27");
    el.style.color = isSel ? "#12100e" : (und ? "#8a8071" : "#f2e9d8");
    const meta = el.querySelector(".tile-meta");
    if (meta) meta.style.color = isSel ? "#3d3116" : (und ? "#6d6558" : (sh ? "#c9a227" : "#8a8071"));
  });
  // Fresh card element so its rise animation restarts (the prototype's key remount).
  const slot = document.getElementById("sel-slot");
  if (slot) slot.innerHTML = selCardHTML(d);
}

async function run() {
  if (state.loading && state.ran) return;
  const name = nameInput.value.trim();
  if (!name) return;
  const query = buildQuery(name);
  Object.assign(state, { loading: true, failed: false, note: "Querying Wikidata for everyone called " + name + "\u2026", query: query, selected: 0 });
  runBtn.textContent = "QUERYING";
  renderStatus();
  renderResults();
  stagesEl.hidden = false;
  const loader = stagedLoader(stagesEl, { source: "Wikidata", budgetMs: 26000 });
  loader.request();
  try {
    const rows = await sparql(query);
    loader.parse(rows.length);
    if (!rows.length) {
      Object.assign(state, { loading: false, failed: true, rows: [], note: "No human in Wikidata carries \u201c" + name + "\u201d as an exact English label. Try a more common spelling, or a full name with a middle initial removed." });
    } else {
      Object.assign(state, { loading: false, failed: false, rows: rows, ran: name, note: "" });
    }
  } catch (e) {
    const msg = e.message === "TIMEOUT" ? "The public query service timed out. It does that \u2014 run it again."
      : (e.message === "RATE_LIMIT" ? "Wikidata is rate-limiting this browser. Wait a moment and retry." : "Could not reach the Wikidata query service.");
    Object.assign(state, { loading: false, failed: true, note: msg });
    // The app's own panel carries the recovery copy; the stage row only
    // has to say which stage broke.
    loader.fail("Wikidata did not respond");
  }
  runBtn.textContent = state.loading ? "QUERYING" : "RUN THE QUERY";
  // fail() is a no-op once settled, so the catch path above still wins.
  if (state.failed) { loader.fail("Wikidata returned nothing usable"); }
  else { loader.render(); }
  renderStatus();
  renderResults();
  if (!state.failed) { loader.done(); stagesEl.hidden = true; }
}

async function runB() {
  const name = nameBInput.value.trim();
  if (!name || state.busyB) return;
  state.busyB = true;
  renderVersusSlot();
  try {
    const rows = await sparql(buildQuery(name));
    Object.assign(state, { rowsB: rows, ranB: name, busyB: false });
  } catch (e) {
    Object.assign(state, { rowsB: [], busyB: false });
  }
  renderVersusSlot();
}

function updateVersusControls() {
  versusBtn.textContent = state.versus ? "COMPARING TWO NAMES" : "COMPARE TWO NAMES";
  versusBtn.style.background = state.versus ? "#c9a227" : "transparent";
  versusBtn.style.color = state.versus ? "#12100e" : "#c9a227";
  nameBInput.style.display = state.versus ? "" : "none";
}

// Static wiring.
runBtn.addEventListener("click", run);
nameInput.addEventListener("keydown", e => { if (e.key === "Enter") run(); });
nameBInput.addEventListener("keydown", e => { if (e.key === "Enter") runB(); });
versusBtn.addEventListener("click", () => {
  state.versus = !state.versus;
  updateVersusControls();
  if (state.versus) runB(); else renderVersusSlot();
});

presetsEl.innerHTML = PRESETS.map((p, i) => '<button type="button" class="preset" data-preset="' + i + '">' + esc(p) + '</button>').join('');
presetsEl.addEventListener("click", e => {
  const b = e.target.closest("[data-preset]");
  if (!b) return;
  nameInput.value = PRESETS[parseInt(b.dataset.preset, 10)];
  run();
});

// Delegated wiring inside the re-rendered results region.
resultsEl.addEventListener("click", e => {
  const tile = e.target.closest("[data-select]");
  if (tile) { selectPerson(parseInt(tile.dataset.select, 10)); return; }
  if (e.target.closest("#links-btn")) {
    state.showLinks = !state.showLinks;
    const btn = document.getElementById("links-btn");
    if (btn) btn.textContent = state.showLinks ? "HIDE SHARED TRADES" : "SHOW SHARED TRADES";
    const slot = document.getElementById("links-slot");
    if (slot) slot.innerHTML = state.showLinks ? linksHTML(derive()) : "";
    return;
  }
  if (e.target.closest("#query-btn")) {
    state.showQuery = !state.showQuery;
    const btn = document.getElementById("query-btn");
    if (btn) btn.textContent = state.showQuery ? "HIDE" : "SHOW SPARQL";
    const slot = document.getElementById("query-slot");
    if (slot) slot.innerHTML = state.showQuery ? queryPreHTML() : "";
    return;
  }
});

renderStatus();
run();
</script>
</body>
</html>
